<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <p class="subtitle">PokéAPI Explorer</p>
            <h1>Pokémon World</h1>
            <p class="description">
                Explore the first 20 Pokémon and discover their abilities.
            </p>

            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Pokémon..."
                    aria-label="Search Pokémon by name"
                >
            </div>
        </div>
    </header>

    <main class="container">

        <div id="loading" class="loading">
            Loading Pokémon...
        </div>

        <div id="error" class="error hidden">
            Unable to load Pokémon. Please try again.
        </div>

        <div id="pokemonGrid" class="pokemon-grid"></div>

        <p id="noResults" class="no-results hidden">
            No Pokémon found.
        </p>

    </main>

    <footer>
        <p>
            Data provided by
            <a href="https://pokeapi.co" target="_blank">
                PokéAPI
            </a>
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
